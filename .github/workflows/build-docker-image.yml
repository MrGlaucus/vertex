name: Publish Docker Image on Tag

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: dockerhub-vertex-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: mrglaucus/vertex
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate settings and image tags
        id: image
        shell: bash
        env:
          GIT_TAG: ${{ github.ref_name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Configure repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.'
            exit 1
          fi
          if [[ ! "$GIT_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo '::error::Git tag must also be a valid Docker tag: letters, digits, underscores, dots and hyphens; at most 128 characters.'
            exit 1
          fi
          if [[ "$GIT_TAG" == latest ]]; then
            echo '::error::The latest tag is reserved. Push a version tag such as v1.0.0.'
            exit 1
          fi
          {
            printf 'tags<<IMAGE_TAGS\n%s:%s\n' "$IMAGE_NAME" "$GIT_TAG"
            # Prereleases and custom tags do not replace latest.
            if [[ "$GIT_TAG" =~ ^[vV]?[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              printf '%s:latest\n' "$IMAGE_NAME"
            fi
            printf 'IMAGE_TAGS\n'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for validation and frontend
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webui/package-lock.json

      # Tests use Node's SQLite adapter; the image builds native production dependencies.
      - name: Install validation dependencies
        run: npm ci --ignore-scripts

      - name: Test backend
        run: npm test

      - name: Lint backend
        run: |
          npm run eslint -- --rule 'linebreak-style: off'

      - name: Install frontend dependencies
        working-directory: webui
        run: npm ci --legacy-peer-deps

      - name: Lint frontend
        working-directory: webui
        run: |
          npm run eslint -- --rule 'linebreak-style: off'

      - name: Generate themes
        working-directory: webui
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/styles
          node dark
          node light
          node cyber
          for theme in dark light cyber; do
            test -s "public/assets/styles/$theme.less"
          done
          cat >> public/assets/styles/cyber.less <<'LESS'
          @import url(/api/setting/getBackground.less);
          .body-bg {
            background: @vt-bg-image;
            background-position-x: center;
            background-position-y: center;
            background-size: cover;
          }
          .login-layout {
            background: @body-background;
          }
          LESS
          touch public/assets/styles/follow.less

      - name: Build frontend from tagged source
        working-directory: webui
        run: npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push AMD64 and ARM64 images
        uses: docker/build-push-action@v7
        with:
          # Path context includes the frontend generated above.
          context: .
          file: docker/Dockerfile.local
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=vertex-release
          cache-to: type=gha,mode=max,scope=vertex-release

      - name: Write publication summary
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
        run: |
          {
            echo '### Published Docker images'
            printf '%s\n' "$IMAGE_TAGS" | while IFS= read -r image; do
              printf -- '- `%s`\n' "$image"
            done
            echo ''
            echo 'Platforms: linux/amd64, linux/arm64'
          } >> "$GITHUB_STEP_SUMMARY"
